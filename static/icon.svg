<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background & Dark Base Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e2208" />
      <stop offset="100%" stop-color="#0a0c02" />
    </radialGradient>

    <!-- Glowing Smoke / Light Beam Effect -->
    <linearGradient id="smokeGlow" x1="0%" y1="100%" x2="20%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#c1e3cd" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#4a7c59" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e3323" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Horizontal Base Smoke -->
    <radialGradient id="baseSmoke" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#d4e8bb" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8ba862" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e2208" stop-opacity="0" />
    </radialGradient>

    <!-- 'A' Character Gradient -->
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2f592" />
      <stop offset="60%" stop-color="#a3c448" />
      <stop offset="100%" stop-color="#698227" />
    </linearGradient>

    <!-- Blur filter for atmospheric smoke/glow -->
    <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="128" height="128" rx="16" fill="url(#bgGrad)" />

  <!-- Smoke / Glow Effect (Behind/Around Crotch of 'A') -->
  <!-- Base Ambient Smoke -->
  <ellipse cx="80" cy="92" rx="30" ry="12" fill="url(#baseSmoke)" filter="url(#glowBlur)" />
  
  <!-- Rising Smoke Pillar -->
  <path d="M 60,98 Q 78,92 82,60 Q 86,30 98,15 L 108,18 Q 94,45 88,72 Q 82,98 60,98 Z" fill="url(#smokeGlow)" filter="url(#glowBlur)" />

  <!-- Main Central Slanted 'A' Element -->
  <g transform="translate(10, 8)">
    <path d="
      M 72, 22 
      L 86, 22 
      L 90, 96 
      L 76, 96 
      L 74, 80 
      L 58, 80 
      L 48, 96 
      L 34, 96 
      Z
      M 62, 40 
      L 55, 68 
      L 72, 68 
      Z
    " fill="url(#aGrad)" stroke="#51681a" stroke-width="1.5" stroke-linejoin="round" />
  </g>
</svg>