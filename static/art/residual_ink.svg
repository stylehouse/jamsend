<?xml version="1.0" encoding="UTF-8"?>
<!--
  residual_ink.svg  —  "ink ∝ surprise"
  A visualisation of predictive-coding compression of the C** data model.
  A large continuous BODY carries calm, PALE ink fields: continuous islands
  where many particles resolve alike (same mainkey, same sc-shape) and cost
  almost no ink. A FEW dark SURPRISE flecks and tears mark where a particle
  deviates — an odd row with an extra sc, an undef marker, a .c-foam bloom.
  Uniform recedes to near-void; anomaly seizes the eye. Same ink rule.
  Cell walls echo cello_blob.ts: a ring of points, a two-octave seeded
  wobble, closed as a smooth hand-drawn curve. Restrained jewel palette.
  Hand-authored. Not generated at load; not a placeholder.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"
     font-family="Georgia, 'Times New Roman', serif">

  <defs>
    <!-- The body ground: a deep, warm-cool slate the pale inks float upon -->
    <radialGradient id="ground" cx="42%" cy="38%" r="80%">
      <stop offset="0%"  stop-color="#14161f"/>
      <stop offset="55%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#070810"/>
    </radialGradient>

    <!-- Three jewel inks, each a translucent island of kin. Pale by construction. -->
    <radialGradient id="ink-jade" cx="40%" cy="40%" r="75%">
      <stop offset="0%"  stop-color="#4fd6b0" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#2f9d84" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1c5f56" stop-opacity="0.04"/>
    </radialGradient>
    <radialGradient id="ink-amethyst" cx="55%" cy="45%" r="75%">
      <stop offset="0%"  stop-color="#9d7fe0" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#6e56b5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3d2e70" stop-opacity="0.03"/>
    </radialGradient>
    <radialGradient id="ink-sapphire" cx="45%" cy="55%" r="75%">
      <stop offset="0%"  stop-color="#5aa6e6" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#3670bf" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#20406f" stop-opacity="0.03"/>
    </radialGradient>
    <radialGradient id="ink-topaz" cx="50%" cy="42%" r="72%">
      <stop offset="0%"  stop-color="#e6c96a" stop-opacity="0.20"/>
      <stop offset="70%" stop-color="#b89238" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#6b5320" stop-opacity="0.02"/>
    </radialGradient>

    <!-- A surprise fleck glows: a dark garnet core with a hot rim that seizes the eye -->
    <radialGradient id="surprise-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ff5a6e"/>
      <stop offset="35%" stop-color="#b21f3a"/>
      <stop offset="100%" stop-color="#3a0710"/>
    </radialGradient>
    <radialGradient id="surprise-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ff2d55" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2d55" stop-opacity="0"/>
    </radialGradient>

    <!-- Kin-texture: the faint dotted grain of expected particles resolving alike -->
    <pattern id="kin-grain" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(11)">
      <circle cx="4" cy="4" r="1.15" fill="#cfeee4" fill-opacity="0.10"/>
      <circle cx="17" cy="15" r="0.9" fill="#cfeee4" fill-opacity="0.07"/>
    </pattern>
    <pattern id="kin-grain-v" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <circle cx="6" cy="6" r="1.05" fill="#ddd2f4" fill-opacity="0.09"/>
      <circle cx="16" cy="17" r="0.85" fill="#ddd2f4" fill-opacity="0.06"/>
    </pattern>

    <!-- Soft blur for halos and .c-foam -->
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft-lg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- ============================ THE BODY ============================ -->
  <rect x="0" y="0" width="1200" height="900" fill="url(#ground)"/>

  <!-- a very faint whole-field vignette of kin-grain: the machine is mostly expected -->
  <rect x="0" y="0" width="1200" height="900" fill="url(#kin-grain)" opacity="0.5"/>

  <!-- ================= LAYER 1 — PALE INK ISLANDS (kin) ================= -->
  <!-- Each blob: a continuous island where many particles share a mainkey + sc-shape.
       The cello_blob wobble is baked into the cubic path control points by hand. -->

  <!-- Jade island: the largest calm field (a shelf of %Record resolving alike) -->
  <g>
    <path d="M 250 470
             C 210 405, 232 330, 305 300
             C 378 270, 470 262, 545 292
             C 620 322, 660 300, 705 345
             C 750 390, 738 470, 690 520
             C 642 570, 660 640, 590 668
             C 520 696, 420 690, 348 656
             C 276 622, 290 535, 250 470 Z"
          fill="url(#ink-jade)" filter="url(#soft)"/>
    <path d="M 250 470
             C 210 405, 232 330, 305 300
             C 378 270, 470 262, 545 292
             C 620 322, 660 300, 705 345
             C 750 390, 738 470, 690 520
             C 642 570, 660 640, 590 668
             C 520 696, 420 690, 348 656
             C 276 622, 290 535, 250 470 Z"
          fill="none" stroke="#5fe0bd" stroke-opacity="0.22" stroke-width="1.4"/>
    <path d="M 250 470
             C 210 405, 232 330, 305 300
             C 378 270, 470 262, 545 292
             C 620 322, 660 300, 705 345
             C 750 390, 738 470, 690 520
             C 642 570, 660 640, 590 668
             C 520 696, 420 690, 348 656
             C 276 622, 290 535, 250 470 Z"
          fill="url(#kin-grain)"/>
  </g>

  <!-- Amethyst island (upper right): a rank of %req, one motif -->
  <g>
    <path d="M 720 250
             C 700 200, 745 155, 810 150
             C 875 145, 945 168, 980 210
             C 1015 252, 1002 300, 1030 340
             C 1058 380, 1030 435, 968 448
             C 906 461, 838 452, 792 418
             C 746 384, 758 340, 736 305
             C 714 285, 740 300, 720 250 Z"
          fill="url(#ink-amethyst)" filter="url(#soft)"/>
    <path d="M 720 250
             C 700 200, 745 155, 810 150
             C 875 145, 945 168, 980 210
             C 1015 252, 1002 300, 1030 340
             C 1058 380, 1030 435, 968 448
             C 906 461, 838 452, 792 418
             C 746 384, 758 340, 736 305
             C 714 285, 740 300, 720 250 Z"
          fill="none" stroke="#b49bf0" stroke-opacity="0.20" stroke-width="1.3"/>
    <path d="M 720 250
             C 700 200, 745 155, 810 150
             C 875 145, 945 168, 980 210
             C 1015 252, 1002 300, 1030 340
             C 1058 380, 1030 435, 968 448
             C 906 461, 838 452, 792 418
             C 746 384, 758 340, 736 305
             C 714 285, 740 300, 720 250 Z"
          fill="url(#kin-grain-v)"/>
  </g>

  <!-- Sapphire island (lower left): a %Library shelf -->
  <g>
    <path d="M 175 690
             C 150 640, 178 600, 235 592
             C 292 584, 355 600, 398 636
             C 441 672, 470 660, 500 700
             C 530 740, 512 795, 452 812
             C 392 829, 315 826, 258 800
             C 201 774, 200 740, 175 690 Z"
          fill="url(#ink-sapphire)" filter="url(#soft)"/>
    <path d="M 175 690
             C 150 640, 178 600, 235 592
             C 292 584, 355 600, 398 636
             C 441 672, 470 660, 500 700
             C 530 740, 512 795, 452 812
             C 392 829, 315 826, 258 800
             C 201 774, 200 740, 175 690 Z"
          fill="none" stroke="#79b6ee" stroke-opacity="0.18" stroke-width="1.3"/>
    <path d="M 175 690
             C 150 640, 178 600, 235 592
             C 292 584, 355 600, 398 636
             C 441 672, 470 660, 500 700
             C 530 740, 512 795, 452 812
             C 392 829, 315 826, 258 800
             C 201 774, 200 740, 175 690 Z"
          fill="url(#kin-grain)"/>
  </g>

  <!-- ================= LAYER 2 — translucent overlaps (shared prior) ================= -->
  <!-- A topaz wash bridging jade and amethyst: kinship as overlapping expectation. -->
  <path d="M 560 350
           C 600 300, 690 300, 745 330
           C 800 360, 815 420, 780 470
           C 745 520, 660 540, 600 512
           C 540 484, 520 400, 560 350 Z"
        fill="url(#ink-topaz)" filter="url(#soft)" opacity="0.9"/>

  <!-- a small third-layer amethyst mist where three fields agree — palest of all -->
  <path d="M 620 460
           C 650 430, 705 432, 728 462
           C 751 492, 740 535, 700 548
           C 660 561, 612 545, 604 508
           C 598 484, 590 490, 620 460 Z"
        fill="url(#ink-amethyst)" opacity="0.5" filter="url(#soft)"/>

  <!-- ============ LAYER 3 — kin motes: expected particles, near-void ============ -->
  <!-- Faint pale motes scattered inside the islands: each an unsurprising particle,
       costing almost no ink, absorbed into its cluster's texture. -->
  <g fill="#dff5ee" fill-opacity="0.16" filter="url(#grain-blur)">
    <circle cx="330" cy="400" r="3.2"/><circle cx="372" cy="378" r="2.6"/>
    <circle cx="418" cy="392" r="3.0"/><circle cx="460" cy="372" r="2.4"/>
    <circle cx="505" cy="398" r="2.8"/><circle cx="350" cy="452" r="2.5"/>
    <circle cx="398" cy="440" r="3.1"/><circle cx="445" cy="452" r="2.6"/>
    <circle cx="492" cy="438" r="2.9"/><circle cx="540" cy="428" r="2.4"/>
    <circle cx="372" cy="502" r="2.7"/><circle cx="420" cy="512" r="3.0"/>
    <circle cx="468" cy="500" r="2.5"/><circle cx="516" cy="510" r="2.8"/>
    <circle cx="562" cy="486" r="2.3"/><circle cx="405" cy="560" r="2.6"/>
    <circle cx="452" cy="572" r="2.9"/><circle cx="500" cy="560" r="2.5"/>
    <circle cx="548" cy="566" r="2.7"/><circle cx="596" cy="548" r="2.2"/>
  </g>
  <g fill="#e7ddf7" fill-opacity="0.15" filter="url(#grain-blur)">
    <circle cx="800" cy="220" r="2.8"/><circle cx="848" cy="205" r="2.5"/>
    <circle cx="895" cy="222" r="3.0"/><circle cx="942" cy="240" r="2.4"/>
    <circle cx="820" cy="270" r="2.6"/><circle cx="868" cy="282" r="2.9"/>
    <circle cx="916" cy="272" r="2.5"/><circle cx="962" cy="292" r="2.7"/>
    <circle cx="842" cy="330" r="2.6"/><circle cx="890" cy="342" r="2.8"/>
    <circle cx="938" cy="330" r="2.4"/><circle cx="812" cy="380" r="2.7"/>
    <circle cx="860" cy="392" r="2.5"/><circle cx="908" cy="388" r="2.9"/>
  </g>
  <g fill="#dcecfb" fill-opacity="0.15" filter="url(#grain-blur)">
    <circle cx="240" cy="660" r="2.7"/><circle cx="288" cy="648" r="2.5"/>
    <circle cx="335" cy="662" r="2.9"/><circle cx="382" cy="678" r="2.4"/>
    <circle cx="262" cy="710" r="2.6"/><circle cx="310" cy="722" r="2.8"/>
    <circle cx="358" cy="712" r="2.5"/><circle cx="405" cy="726" r="2.7"/>
    <circle cx="285" cy="762" r="2.6"/><circle cx="333" cy="772" r="2.8"/>
    <circle cx="380" cy="762" r="2.4"/><circle cx="428" cy="770" r="2.6"/>
  </g>

  <!-- ================= THE SURPRISES — a FEW dark flecks & tears ================= -->
  <!-- These blaze by the same ink rule that makes everything else recede.
       Each marks a real wound named in CLAUDE.md / the residual design. -->

  <!-- SURPRISE 1: an undef sc marker inside the jade field — a hot garnet fleck,
       ringed, with the honest brand of the mint-bug it exposes. -->
  <g>
    <circle cx="452" cy="470" r="46" fill="url(#surprise-halo)" filter="url(#soft-lg)"/>
    <path d="M 452 438
             C 470 436, 486 448, 488 468
             C 490 488, 480 506, 460 510
             C 440 514, 420 504, 416 484
             C 412 464, 434 440, 452 438 Z"
          fill="url(#surprise-core)" stroke="#ff8497" stroke-width="1.4" stroke-opacity="0.9"/>
    <!-- the tear: a thin dark crack radiating from the wound into the calm -->
    <path d="M 452 510 C 448 540, 470 566, 462 604 C 456 632, 480 650, 470 686"
          fill="none" stroke="#7a0e22" stroke-width="2.4" stroke-opacity="0.75" stroke-linecap="round"/>
    <path d="M 452 510 C 448 540, 470 566, 462 604 C 456 632, 480 650, 470 686"
          fill="none" stroke="#ff5a6e" stroke-width="0.7" stroke-opacity="0.5" stroke-linecap="round"/>
    <text x="452" y="474" text-anchor="middle" fill="#ffe3e8" font-size="13" font-style="italic">undef</text>
  </g>

  <!-- SURPRISE 2: a many:1 shape wearing a holding's mainkey (the old-magazine bug).
       A dark angular tear at the amethyst rim — the wrong shape screams. -->
  <g>
    <circle cx="905" cy="330" r="38" fill="url(#surprise-halo)" filter="url(#soft-lg)"/>
    <path d="M 905 300 L 930 322 L 922 356 L 888 360 L 878 326 Z"
          fill="url(#surprise-core)" stroke="#ff8497" stroke-width="1.3" stroke-opacity="0.9"/>
    <path d="M 878 326 C 850 340, 838 372, 806 380 C 782 386, 772 410, 748 414"
          fill="none" stroke="#7a0e22" stroke-width="2.2" stroke-opacity="0.7" stroke-linecap="round"/>
    <text x="905" y="335" text-anchor="middle" fill="#ffe3e8" font-size="11" font-style="italic">of:X</text>
  </g>

  <!-- SURPRISE 3: a .c-foam bloom — refs far over the expected band. A darker
       cluster of small tense cells blooming out of the sapphire calm. -->
  <g>
    <circle cx="330" cy="720" r="40" fill="url(#surprise-halo)" filter="url(#soft-lg)"/>
    <g stroke="#ff8497" stroke-width="1.1" stroke-opacity="0.8">
      <circle cx="330" cy="720" r="14" fill="url(#surprise-core)"/>
      <circle cx="352" cy="704" r="8"  fill="#8f1226"/>
      <circle cx="312" cy="702" r="7"  fill="#8f1226"/>
      <circle cx="350" cy="738" r="9"  fill="#a3172e"/>
      <circle cx="308" cy="740" r="6"  fill="#7a0e22"/>
      <circle cx="368" cy="720" r="5"  fill="#7a0e22"/>
      <circle cx="330" cy="748" r="5"  fill="#8f1226"/>
    </g>
    <text x="330" y="724" text-anchor="middle" fill="#ffe3e8" font-size="10" font-style="italic">.c</text>
  </g>

  <!-- SURPRISE 4: a lone odd row far out in the near-void body — a particle carrying
       an extra sc the others didn't. Small, but the only mark in an empty quarter,
       so it seizes: surprise is rare by construction, and rarity is what blazes. -->
  <g>
    <circle cx="1020" cy="640" r="30" fill="url(#surprise-halo)" filter="url(#soft-lg)"/>
    <path d="M 1020 622
             C 1032 622, 1040 632, 1038 646
             C 1036 660, 1024 666, 1012 662
             C 1000 658, 998 638, 1020 622 Z"
          fill="url(#surprise-core)" stroke="#ff8497" stroke-width="1.2"/>
    <path d="M 1038 646 C 1058 652, 1070 668, 1064 690"
          fill="none" stroke="#7a0e22" stroke-width="1.8" stroke-opacity="0.65" stroke-linecap="round"/>
    <text x="1020" y="700" text-anchor="middle" fill="#c98a94" font-size="11" font-style="italic">+extra sc</text>
  </g>

  <!-- SURPRISE 5: a faint, PARTIAL bloom — a moderate deviation, half-lit: a mote
       grown a rim but not yet a full glyph. Shows the continuum, not just the poles. -->
  <g opacity="0.85">
    <circle cx="640" cy="640" r="20" fill="url(#surprise-halo)" filter="url(#soft)"/>
    <path d="M 640 626 C 652 626, 660 636, 656 650 C 652 664, 636 666, 628 654 C 620 642, 628 626, 640 626 Z"
          fill="#c23a4e" stroke="#e77a8b" stroke-width="1" stroke-opacity="0.8"/>
  </g>

  <!-- ================= a whisper of legend, framed like a print title ================= -->
  <g fill="#8fa0b8" font-size="15">
    <text x="70" y="80" fill="#c9d6e8" font-size="26" letter-spacing="1.5">ink &#8733; surprise</text>
    <text x="70" y="106" font-style="italic" font-size="13.5" fill="#7d8ea6">the residual field — expected recedes to void; deviation seizes the eye</text>
  </g>
  <g font-size="12.5" fill="#7d8ea6">
    <circle cx="80" cy="838" r="4" fill="#dff5ee" fill-opacity="0.4"/>
    <text x="92" y="842" font-style="italic">kin — a particle resolving as its prior predicts</text>
    <circle cx="80" cy="862" r="6" fill="url(#surprise-core)"/>
    <text x="92" y="866" font-style="italic">surprise — a wound: undef, .c-foam, a shape that lies</text>
  </g>

</svg>
