# docker-compose.yml — the DEV instance: the app/runner on :9091 (+ the `claude` CLI container).
#
# PAIRED WITH staging/docker-compose.yml — the EDITOR/staging instance on :9092 (the Editron IDE, a
#  separate git worktree). The two are bridged at runtime by the relay's r2r link (the runner dials
#   ws://172.17.0.1:9092/relay), so editor↔runner frames cross between them. CLUSTER TRUST spans the
#    pair: the secret Idento flock is minted by the editor (🪪 Set up cluster trust) — this side holds
#     `.env.cluster-pubs` (public, for the relay's gen_write verify + the VITE bake) and `.env.cluster-claude`
#      (the CLI's signing key, masked from `app`); the editor side holds pubs too. Edit one of the pair and
#       check the other still lines up (ports, relay bridge, cluster env). See that file's header.

x-common-volumes: &common-volumes
  music-volume: &music-volume "${MUSIC_PATH:-/home/s/Music/71mix/}:/music:ro"
  # The same collection, read-WRITE — for `jamserve` alone (at the bottom, behind a profile).
  #  `app` and `claude` only ever read it and must keep the :ro above; jamserve has to write
  #   <music>/.jamsend, because that is where a browser session's FSA grant already put the
  #    account it resumes from, and where its radiostock belongs. Its LIBRARY= knob keeps the
  #     write surface honest INSIDE the nav (music read-only, only .jamsend writable), so this
  #      is a permission, not a licence to scribble.
  music-volume-rw: &music-volume-rw "${MUSIC_PATH:-/home/s/Music/71mix/}:/music"


services:
  app:
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.19
        WORKDIR /app
        RUN apk add --no-cache \
            nodejs \
            npm
        COPY package*.json ./
        RUN npm install
        COPY . .
    container_name: jamsend-dev
    working_dir: /app
    volumes:
      - .:/app
      # - "./testsounds:/music:ro"
      - *music-volume
      # The broad .:/app would let the dev server READ other roles' secret files off disk. It only
      #  needs the PUBLIC pubs (env_file'd above), so mask the co-located claude secret with a blank
      #   file (same pattern as the .env.chrome-profiles masks on the claude service). Foreign role
      #    files (editor/runner) belong on their own hosts and should not sit in this /app at all.
      - ./.claude/.blank/.blank:/app/.env.cluster-claude:ro
    ports:
      # a bare "9091:9091" binds ALL interfaces (LAN-exposed) — avoid.  Publish to
      #  two explicit addresses instead:
      # - "9091:9091"
      # 127.0.0.1 — reachable as http://localhost:9091 on the host: WebRTC needs a
      #  secure context and localhost counts; it's also where a browser opens the editor
      #   and where the relay endpoint lives.  Not LAN-exposed.
      - "127.0.0.1:9091:9091"
      # 172.17.0.1 — the docker bridge gateway, so a sibling container (the staging
      #  runner) can reach this editor's relay at ws://172.17.0.1:9091/relay over the bridge.
      - "172.17.0.1:9091:9091"
    command: npm run dev -- --host 0.0.0.0 --port 9091
    # Vite reads ALLOWED_HOSTS (public-host allowlist) from here — see .env.example.
    #  .env.local is gitignored; it must exist (cp .env.example .env.local) or `up` errors.
    env_file:
      - .env.local
      # Cluster trust — PUBLIC pubs ONLY (no private key): the relay verifies gen_write against these
      #  and vite.config bakes them into VITE_CLUSTER_TRUSTED_PUBS for the browser. required:false so an
      #   un-minted cluster doesn't break `up` (relay warn-and-allows). The editor browser's OWN signing
      #    key comes from localStorage, never from here. (minted by the editor's 🪪 Set up cluster trust.)
      - path: .env.cluster-pubs
        required: false
    tty: true
    stdin_open: true
    restart: 'always'

    # Cap the dev log so a chatty Vite/HMR run can't fill the disk.  Docker's
    #  json-file driver bounds by SIZE, not line count: ~5MB per file, 2 files
    #  kept (≈10MB rolling).  Takes effect on container recreate (up -d), not a
    #  plain restart.  For a quick view limit instead: docker compose logs --tail 5000 app
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"


    # Resource limits to prevent runaway processes
    deploy:
      resources:
        limits:
          cpus: '2.0'          # Max 2 CPU cores
          memory: 2G           # Max 1GB RAM
        reservations:
          cpus: '0.5'          # Reserve 0.5 CPU cores  
          memory: 256M         # Reserve 256MB RAM
    # Process limits
    ulimits:
      nproc: 100               # Max 100 processes total
      nofile: 1024             # Max 1024 open files


  # Claude Code session.  Bind-mounts the same working tree as app, so its
  #  edits land straight on the host where you review them.
  #  Reach the running app over the compose network at http://app:9091.
  claude:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        RUN apt-get update \
            && apt-get install -y --no-install-recommends git ca-certificates less \
            && rm -rf /var/lib/apt/lists/*
        RUN npm install -g @anthropic-ai/claude-code
        # the named auth volume mounts onto this dir at runtime.
        #  an empty named volume inherits the dir's ownership from the image,
        #   so the dir must exist owned by node before the volume attaches,
        #    else node cannot write its credentials there.
        RUN mkdir -p /home/node/.claude && chown -R node:node /home/node/.claude
    container_name: jamsend-claude
    working_dir: /app
    user: "1000:1000" # is uid 1000, so files it writes are yours on the host
    volumes:
      - .:/app
      - *music-volume
      - claude-auth:/home/node/.claude
      # Mask the two secret env files with an empty file. The broad .:/app would
      #  otherwise expose them; the more specific mount wins, so claude reads
      #   them as empty. The host files are untouched; the app container,
      #    which carries no such overlay, still reads the real values.
      #  A regular empty file is used, not /dev/null: a char-device source makes
      #   runc create the target as a directory, which then cannot take the mount.
      #   The mask is the git-tracked empty file .claude/.blank (line 38's cluster-claude
      #    mask uses it too). It MUST be a file, not a dir: a dir source makes runc try to
      #     mkdir over the image's file and fail ("not a directory"), which is what the stray
      #      .claude/.blankdir/ directory did until 2026-07-06.
      #  To hide all of ty/ instead, replace these two with: - /app/ty
      - ./.claude/.blank:/app/ty/.env.chrome-profiles:ro
      - ./.claude/.blank:/app/ty/droidlounge/.env.chrome-profiles:ro
    environment:
      - CLAUDE_CONFIG_DIR=/home/node/.claude
    env_file:
      # Cluster trust — claude's OWN role secret (CLUSTER_IDENTO_CLAUDE_KEY/_PUB), so the CLI can sign
      #  this_dock_updated / gen_write. Not other roles' keys.
      - path: .env.cluster-claude
        required: false
      # PUBLIC pubs file — carries EDITOR_URL (where ghost-update notifies + verifies the editor) and
      #  the trusted pubs. No secret. required:false so an un-minted cluster doesn't break `up`.
      - path: .env.cluster-pubs
        required: false
    tty: true
    stdin_open: true
    # tini as PID 1 (Docker injects its own docker-init; the slim image ships no
    #  init). Without it, sleep infinity is PID 1 and never reaps: orphaned esbuild
    #   children re-parent to it and pile up as zombies until they exhaust the pids
    #    cap below, at which point the next fork hits EAGAIN and the claude TUI dies.
    init: true
    command: sleep infinity     # stays up; you attach a session with docker compose exec
    restart: 'unless-stopped'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G            # roomier than app, since claude spawns rg, node, subagents (+ svelte-check, ~1.5–2G heap, OOM'd at 2G)
          # cap processes per container via cgroup, the limit we actually want.
          #  nproc is avoided on purpose: it is a per-UID limit counted across
          #   the whole host, so since this runs as node (uid 1000, your own
          #    busy uid) a small nproc starves exec with EAGAIN
          #     "resource temporarily unavailable".
          pids: 512
        reservations:
          cpus: '0.5'
          memory: 512M
    ulimits:
      nofile: 4096


  # peerjs:
  #   image: peerjs/peerjs-server
  #   container_name: jamsend-peerjs
  #   ports:
  #     - "172.17.0.1:9995:9995"
  #   command: ["--port", "9995"]
  #   # the Caddy handle_path in leproxy takes this bit of path off
  #   #, "--path", "/peerjs-server"]
  #   restart: 'always'


  # tyrant-logger:
  #   build:
  #     context: .
  #     dockerfile: ty/Dockerfile
  #   container_name: jamsend-tyrant-logger
  #   user: "1000:1000"  # Run as your UID to avoid permission issues
  #   volumes:
  #     - ./ty:/app
  #     - ./logs:/logs
  #   ports:
  #     - "172.17.0.1:9393:9393"
  #   environment:
  #     - LOG_DIR=/logs
  #     - MOJO_LOG_LEVEL=info
  #     - MOJO_MODE=production
  #   restart: 'always'


  # ── jamserve — "a user's personal internet infrastructure, music piracy only for now" ───────
  # The always-on personal box: runs scripts/daemon headless, holds the collection, answers heists
  #  and Invites, and keeps one peer on the network whose uptime is not somebody's browser session.
  #  Closes the arc: "a Sounditron that can't be closed".  README.md documents it for users.
  #
  # BEHIND A PROFILE, so a plain `docker compose up` never starts it.  Naming the service turns its
  #  profile on for you, so the commands stay short — that is the whole reason it lives here rather
  #   than in a second compose file (which made every command carry two -f flags, and made
  #    `docker compose logs jamserve` fail with "no such service"):
  #      docker compose up -d --build jamserve
  #      docker compose logs -f jamserve      ·      docker logs -f jamserve   (always works)
  #      docker compose stop jamserve
  jamserve:
    profiles: ["jamserve"]
    build:
      context: .
      dockerfile: jamserve/Dockerfile
    container_name: jamserve
    working_dir: /app
    # uid 1000 — so everything it writes into YOUR music folder is YOURS, same as `claude` above.
    #  MEASURED the hard way on the first boot, 2026-08-08: as root it laid down /music/.jamsend as
    #   root:root 700, which locks the browser (which holds the FSA grant and runs as you) out of the
    #    very account it is supposed to provision and jamserve resume.  The image chowns
    #     /var/lib/jamserve and /app/node_modules to node so the volumes below inherit that.
    user: "1000:1000"

    volumes:
      # THE MACHINE: the jamsend source it boots out of — wormhole/ fixtures, GhostList, Ghost/*.g,
      #  src/lib/gen/*.go.  A different tree from the collection, which is why one mount is not enough.
      - .:/app

      # ⚠ THE LINE THAT MATTERS, AND IT IS STICKY.  An anonymous volume shadowing /app/node_modules so
      #  this container keeps the musl tree its OWN image built rather than inheriting the host's
      #   through .:/app above.  `app` (Alpine/musl) and `claude` (Debian/glibc) already share one
      #    /app/node_modules and an install from either strands the other — that took the app down for
      #     hours on 2026-08-07 (CLAUDE.md).  jamserve is a THIRD libc consumer.
      #  STICKY: `up` REUSES the previous container's anonymous volume rather than repopulating from
      #   the new image (compose's own words: "retrieving data from the previous containers"), so a
      #    rebuild alone does NOT re-lay this directory — including its OWNERSHIP.  That bit right
      #     after the run-as-root fix above: the image chowned node_modules, the volume kept the
      #      root-owned copy, and vite died with EACCES writing node_modules/.vite-temp.
      #  So when the image's node_modules must actually win:  up -d --renew-anon-volumes jamserve
      - /app/node_modules

      # THE COLLECTION + the account inside it.  Read-write, unlike `app` and `claude` — see the
      #  anchor at the top of this file for why, and for what keeps that honest.
      - *music-volume-rw

      # Dexie state = the identity cache, so this is what makes jamserve the SAME peer across
      #  restarts.  Survivable to lose (it re-seeds off <music>/.jamsend), but don't lose it casually.
      #  Also sticky, and stickier than the anonymous one: a named volume survives by design, so a
      #   run-as-root era volume needs an explicit `docker volume rm <project>_jamserve-state`.
      #    NOT `docker compose down -v`, which takes claude-auth with it.
      - jamserve-state:/var/lib/jamserve

    environment:
      # a Book under the hood, exactly as /BigSoundland does it.
      - B=Sounditron
      # NOT a runner: boot_role=daemon runs Books but never claims the editor's `runner` relay
      #  address.  Two claimants of one address both receive every frame — the `channel DEAD — 20s
      #   silent` of Daemon_todo §4.  CHANNEL=1 opts back in; leave it off.
      - CHANNEL=0
      - RELAY=1
      # the granted folder: music read-only, .jamsend read-write (§5.3, one knob).
      - LIBRARY=/music
      # ── WHO THIS BOX IS.  Resume a browser-provisioned identity: `ls <music>/.jamsend/account/`,
      #  the directory names are the prepubs.  Booting with I= set and no such account on disk EXITS 2
      #   rather than inventing a stranger — that arrest is the feature.
      - I=${JAMSERVE_ID:-}
      # KEYED is the knob that actually decides whether an unconfigured box MINTS a stranger, and it
      #  is not the obvious one.  `seed_identity` writes a keypair to KEYFILE whenever none is there,
      #   independent of both I= and ROLE — and the keyfile adopt then WINS over ROLE, so ROLE is
      #    inert unless KEYED=0.  Defaulting ROLE off is therefore NOT enough on its own; that was
      #     measured on 2026-08-08, when a box with ROLE unset minted `7c0d0bfdb35e` anyway.
      #  OFF here, so an unprovisioned jamserve says what is wrong instead of quietly becoming
      #   somebody.  §4.1: the daemon never provisions.
      - KEYED=${JAMSERVE_KEYED:-0}
      # ROLE=<name> mints a THROWAWAY under that name (needs KEYED=0, which is the default above) —
      #  a smoke-test convenience so the box is runnable before anyone has provisioned anything.
      #   The daemon complains for as long as it runs on one: a throwaway is nobody's friend, no one
      #    can invite it, and it dies with the container.
      - ROLE=${JAMSERVE_ROLE:-}
      # machine scratch + state — NOT the music folder.
      - DAEMON_STATE=/var/lib/jamserve/state
      - OVERLAY=/var/lib/jamserve/scratch
      # LOG lands on the BIND MOUNT on purpose: it is the only way a sibling container (claude, which
      #  has no docker socket) can read what jamserve did.  Gitignored.
      - LOG=/app/jamserve/run.log
      # exit on a timer so `restart: always` re-launches on freshly-edited source — which is why no
      #  `up --build` loop is needed to iterate.  JAMSERVE_SECS=0 for a box that never voluntarily exits.
      - SECS=${JAMSERVE_SECS:-900}
      # `app`'s relay over the docker bridge it already publishes to.  A RUNTIME dependency, not just
      #  boot-time: Auto.svelte and Tyranny.svelte fetch /log?stream= during normal operation and
      #   resolve it against ORIGIN (Daemon_todo §8.5).
      - ORIGIN=${JAMSERVE_ORIGIN:-http://172.17.0.1:9091}
      - PORT=9099
      # a fixed token so a sibling container can query /status and /c without scraping the log.
      - STATUS_TOKEN=${JAMSERVE_TOKEN:-jamserve-local}
      # where the invite link printed by a THROWAWAY box points.  localhost, not ORIGIN: ORIGIN is the
      #  docker-bridge address this container reaches the dev server by, and a browser on the host
      #   opening that gets no secure context — WebRTC then refuses, which reads as a peering failure
      #    and is not one.  Change it if your dev server is published somewhere else.
      - INVITE_ORIGIN=${JAMSERVE_INVITE_ORIGIN:-http://localhost:9091}
      # FFTEST=1 transcodes one real track at boot to prove the levelled-encode path end to end.
      #  OFF by default: measuring costs seconds, transcoding costs minutes, and this box restarts on
      #   a timer.  Worth running by hand once after an image change.
      - FFTEST=${JAMSERVE_FFTEST:-}
      # bind the status endpoint to all interfaces INSIDE the container so the published port below
      #  reaches it.  Still only published to the docker bridge; /stop and /c both require the token.
      - HOST=0.0.0.0

    ports:
      # bridge-only, never the LAN — same discipline as `app`'s 172.17.0.1 publish.
      - "172.17.0.1:9099:9099"

    restart: 'always'
    init: true
    tty: true

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

    deploy:
      resources:
        limits:
          # roomier than `app`: this one decodes and re-encodes audio while holding a radio's warm
          #  window.  rec.c.pcm pinned ~92MB per record before the 2026-08-07 fix, so the headroom
          #   is not theoretical.
          cpus: '2.0'
          memory: 3G
          pids: 512
        reservations:
          cpus: '0.25'
          memory: 256M
    ulimits:
      nofile: 4096


volumes:
  # Holds credentials, settings, and session history across rebuilds.
  claude-auth:
  # jamserve's Dexie state — see the service above. Safe to `docker volume rm` (it re-seeds off
  #  <music>/.jamsend); NOT safe to reach via `down -v`, which would take claude-auth too.
  jamserve-state:
