<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- PWA install: the manifest carries name/icons/start_url for Android + desktop.
		     iOS ignores the manifest's display/name and reads the apple-* meta instead, so
		     both are needed.  Colours match icon.svg's dark olive base (#0a0c02). -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#0a0c02" />
		<!-- iOS IGNORES SVG apple-touch-icons, so it gets a raster: 180×180, opaque, square corners (iOS
		     rounds them).  Exported from icon.svg 2026-10-21. -->
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="jamsend" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="background:black;">
		<div style="display:contents">%sveltekit.body%</div>
	</body>
</html>
