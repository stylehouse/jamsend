# this file becomes docker-compose.yml on prod
# < chrome beings
# < give readonly access to chrome in an app server, a racast

services:
  app:
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.19
        WORKDIR /app
        RUN apk add --no-cache nodejs npm
    container_name: jamsend-prod
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "172.17.0.1:19091:19091"
    environment:
      - NODE_ENV=production
    command: npx vite --host 0.0.0.0 --port 19091
    tty: true
    stdin_open: true
    
    restart: always
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    ulimits:
      nproc: 100
      nofile: 1024

  peerjs:
    image: peerjs/peerjs-server
    container_name: jamsend-prod-peerjs
    ports:
      - "172.17.0.1:9995:9995"
    command: ["--port", "9995"]
    restart: always
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    ulimits:
      nproc: 100
      nofile: 1024

  tyrant-logger:
    build:
      context: .
      dockerfile_inline: |
        FROM perl:5.38-slim

        WORKDIR /app

        # Install Mojolicious and dependencies
        RUN cpanm --notest \
            Mojolicious \
            JSON::PP \
            Time::HiRes

        # Run the application
        CMD ["perl", "/app/tyrant-logger.pl", "daemon", "-l", "http://*:9393"]

    container_name: jamsend-prod-tyrant-logger
    user: "1000:1000" # Run as your UID to avoid permission issues
    volumes:
      - ./ty:/app
      - ./logs:/logs
    ports:
      - "172.17.0.1:9393:9393"
    environment:
      - LOG_DIR=/logs
      - MOJO_LOG_LEVEL=info
      - MOJO_MODE=production
    restart: always
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    ulimits:
      # this is too low, and isn't per container
      #  because we are running against uid=1000
      # nproc: 100
      nofile: 1024





  # COTURN IS GONE (2026-08-12).  TURN is abandoned — the transport is the websocket
  #  relay now, so there is no STUN/TURN server to run, no TLS cert to lift out of
  #   leproxy's Caddy, and no relay port range to forward.  ty/turnserver.conf and
  #    ty/coturn-entrypoint.sh are left on disk as the record of what it was.
  #  Its config carried a live hazard that only made sense on the jump server: the
  #   denied-peer-ip lines for 10/8, 172.16/12 and 192.168/16 were commented out
  #    because "much less dangerous on a cloud VPS with no LAN behind it".  Direct
  #     mode puts it on the home LAN, so if TURN ever comes back it comes back with
  #      those three lines UNCOMMENTED and a credential that isn't in the repo.

  # UPNP-FORWARDER MOVED TO LEPROXY (2026-08-12).  It asked the router to open 9999 —
  #  Caddy's port, not one of ours: every service here publishes to 172.17.0.1 only.
  #   Forwarding is a per-HOST singleton (one router, one WAN ip, ~32 mapping slots),
  #    so it belongs beside the component that decides what faces the internet, the way
  #     duckdns-updater already does.  leproxy generates it from the same list it gives
  #      Caddy's `ports:`, and only in direct mode — which is why prod.sh no longer
  #       strips anything, and no longer reads leproxy's .env to decide.
  #  See leproxy/upnp_forward.sh (was ty/upnp-loop.sh).

# No `volumes:` block: leproxy_caddy_data was declared external for coturn's TLS certs
#  and mounted by nothing even then.  An `external: true` volume that must pre-exist is
#   a stand-up failure waiting to happen, so it goes with coturn.