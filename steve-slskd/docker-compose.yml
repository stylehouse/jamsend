# steve-slskd — Soulseek (slskd) in Docker
# Run on the HOST docker daemon (where /music and the Soul drive actually live):
#   docker compose up -d
# Web UI:  http://localhost:5030
#
# Host paths & IDs come from ./.env (edit that, not this file).

name: steve-slskd

services:
  slskd:
    image: slskd/slskd:latest
    container_name: steve-slskd
    # Run as your user so ./config and downloads are owned by you (easy backup / no root files).
    # If permissions bite, comment this out and let it run as root.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # Web UI. Prefix with 127.0.0.1: if you only want it reachable from this box.
      - "5030:5030"        # http
      # - "5031:5031"      # https (enable web.https in config/slskd.yml first)
      # Soulseek incoming connections — must match soulseek.listen_port in slskd.yml,
      # and ideally be port-forwarded on your router for good connectivity.
      - "50300:50300"
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true   # lets the web UI write back to slskd.yml
      - TZ=${TZ:-Pacific/Auckland}
    volumes:
      # ── config + STATE + logs ──────────────────────────────────────────────────────
      # slskd's whole application dir is /app inside the container. Bind-mounting it to a
      # plain host folder means your favourited users, share cache, and settings live in
      # ./config as ordinary files — back them up with `tar`/`rsync`, no docker volume to
      # forget about. (This is the fix for the "it was in a volume backup somewhere" pain.)
      - ./config:/app
      # ── music library — shared READ-ONLY, mirrors the jamsend project's mount ───────
      - "${MUSIC_PATH:-/home/s/Music/71mix/}:/music:ro"
      # ── downloads land on the Soul drive ───────────────────────────────────────────
      - "${DOWNLOAD_PATH:-/media/s/be3654b3-8643-4a6e-9477-68327cc11ff5/steve/Soul}:/downloads"
    restart: unless-stopped
